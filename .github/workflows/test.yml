name: Provider contracts
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Test against the current stock Hermes runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fusion-evidence"
          docker pull nousresearch/hermes-agent:latest
          docker image inspect nousresearch/hermes-agent:latest > "$RUNNER_TEMP/fusion-evidence/image.json"
          docker run --rm --entrypoint /bin/sh \
            -v "$GITHUB_WORKSPACE:/plugin" \
            -v "$RUNNER_TEMP/fusion-evidence:/evidence" \
            nousresearch/hermes-agent:latest -ec '
              test -n "$HERMES_PYTHON"
              "$HERMES_PYTHON" --version
              "$HERMES_PYTHON" /plugin/scripts/test.py --core /opt/hermes --receipt /evidence/tests.json
            '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: provider-contract-evidence
          path: ${{ runner.temp }}/fusion-evidence/
